<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#040817">
<meta name="description" content="Boules de Givre : jeu d'arcade hivernal, en solo ou a deux, avec editeur de niveaux.">
<title>Boules de Givre</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #040817; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #dff3ff; font: 600 20px system-ui, sans-serif; gap: 14px; pointer-events: none; }
  #bar { width: 220px; height: 8px; border-radius: 4px; background: rgba(120,190,255,.2); overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #7cd0ff; transition: width .2s; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status"><div id="msg">Chargement…</div><div id="bar"><div></div></div></div>
<script>
  var statusEl = document.getElementById('status');
  var msgEl = document.getElementById('msg');
  var barEl = document.querySelector('#bar > div');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      if (!text) { statusEl.classList.add('hidden'); return; }
      var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) barEl.style.width = (100 * parseFloat(m[1]) / parseFloat(m[3])) + '%';
      msgEl.textContent = text.replace(/\(.*\)/, '').trim() || 'Chargement…';
    },
    onRuntimeInitialized: function () { statusEl.classList.add('hidden'); },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  window.addEventListener('error', function () { msgEl.textContent = 'Erreur de chargement'; });
  // le clavier doit aller au canvas (fleches, espace) sans faire defiler la page
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault();
  }, { passive: false });
  document.getElementById('canvas').addEventListener('pointerdown', function () { this.focus(); });
</script>
{{{ SCRIPT }}}
</body>
</html>
