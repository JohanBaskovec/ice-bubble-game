name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Bureau Linux + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependances SDL (X11, Wayland, audio)
        run: |
          sudo apt-get update
          # liste issue de docs/README-linux.md de SDL3
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev libjack-dev libsndio-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev liburing-dev imagemagick
      - name: Configurer
        run: cmake --preset desktop-debug
      - name: Compiler
        run: cmake --build --preset desktop-debug -j
      - name: Tests
        run: ctest --preset desktop-debug

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
      - name: Compiler
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j
      - uses: actions/upload-artifact@v4
        with:
          name: boules-de-givre-web
          path: |
            build-web/index.html
            build-web/index.js
            build-web/index.wasm
            build-web/favicon.png

  android:
    name: Android (APK debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer NDK et plateforme (SDK deja present sur le runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "platforms;android-36" "cmake;3.22.1"
      - name: Compiler
        working-directory: platforms/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boules-de-givre-android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (simulateur, sans signature)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generer le projet Xcode
        run: cmake --preset ios
      - name: Compiler
        run: |
          xcodebuild -project build-ios/BoulesDeGivre.xcodeproj -scheme boules-de-givre \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
